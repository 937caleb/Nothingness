<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="小手机">
<meta name="theme-color" content="#0a0e0a">
<title>小手机 AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0e0a;color:#b8ffcc;
font-family:-apple-system,"SF Mono",Menlo,monospace;font-size:15px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;
align-items:center;justify-content:space-between;background:#0f140f;
border-bottom:1px solid #1d2a1d;flex-shrink:0}
.title{font-size:14px;letter-spacing:2px;color:#00ff88}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
background:#333;margin-right:6px;vertical-align:middle}
.status-dot.on{background:#00ff88;box-shadow:0 0 6px #00ff88}
header button{background:none;border:1px solid #2a3a2a;color:#66aa88;
padding:4px 10px;border-radius:6px;font-size:12px;font-family:inherit}
header button:active{background:#1a2a1a}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;
gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;line-height:1.5;
word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#1a3a24;color:#c8ffd8;
border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#141a14;color:#a8d8b8;
border:1px solid #1d2a1d;border-bottom-left-radius:4px}
.msg.error{align-self:center;background:#3a1a1a;color:#ff8888;font-size:12px;
max-width:95%}
.cursor{display:inline-block;width:8px;height:14px;background:#00ff88;
animation:blink 1s infinite;vertical-align:text-bottom;margin-left:2px}
@keyframes blink{50%{opacity:0}}
#input-area{padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
background:#0f140f;border-top:1px solid #1d2a1d;display:flex;gap:8px;
align-items:flex-end;flex-shrink:0}
#input{flex:1;background:#0a0e0a;border:1px solid #2a3a2a;color:#b8ffcc;
padding:10px 12px;border-radius:10px;font-family:inherit;font-size:16px;
resize:none;outline:none;max-height:100px;line-height:1.4}
#input:focus{border-color:#00ff88}
#send{background:#00ff88;color:#0a0e0a;border:none;border-radius:10px;
width:44px;height:44px;font-size:18px;font-weight:bold;flex-shrink:0;
font-family:inherit}
#send:disabled{background:#1d2a1d;color:#446644}
#settings{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;
flex-direction:column;z-index:100;
padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
overflow-y:auto}
#settings.show{display:flex}
#settings h2{color:#00ff88;font-size:16px;letter-spacing:2px;margin:0 0 20px;
font-weight:normal}
#settings label{display:block;font-size:12px;color:#66aa88;margin:16px 0 6px}
#settings input,#settings select,#settings textarea{width:100%;background:#0a0e0a;
border:1px solid #2a3a2a;color:#b8ffcc;padding:10px 12px;border-radius:8px;
font-family:inherit;font-size:14px;outline:none}
#settings input:focus,#settings textarea:focus,#settings select:focus{border-color:#00ff88}
#settings textarea{min-height:80px;resize:vertical}
.btn-row{display:flex;gap:10px;margin-top:24px}
.btn-row button{flex:1;padding:12px;border-radius:10px;font-family:inherit;
font-size:14px;border:1px solid #2a3a2a;background:#141a14;color:#b8ffcc}
.btn-row button.primary{background:#00ff88;color:#0a0e0a;border:none;font-weight:bold}
.btn-row button.danger{color:#ff8888;border-color:#3a1a1a}
.hint{font-size:11px;color:#557755;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span class="status-dot" id="dot"></span>小手机 AI</div>
    <button id="btn-settings">设置</button>
  </header>
  <div id="chat"></div>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="说点什么..."></textarea>
    <button id="send">↑</button>
  </div>
</div>

<div id="settings">
  <h2>// 设置</h2>
  <label>DeepSeek API Key</label>
  <input id="cfg-key" type="password" placeholder="sk-..." autocomplete="off">
  <div class="hint">在 platform.deepseek.com 创建，只保存在你手机本地。</div>

  <label>模型</label>
  <select id="cfg-model">
    <option value="deepseek-chat">deepseek-chat（快）</option>
    <option value="deepseek-reasoner">deepseek-reasoner（推理）</option>
  </select>

  <label>系统提示词（AI 的人设）</label>
  <textarea id="cfg-system" placeholder="你是一个简洁的助手..."></textarea>

  <div class="btn-row">
    <button class="danger" id="btn-clear">清空</button>
    <button id="btn-cancel">取消</button>
    <button class="primary" id="btn-save">保存</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const chatEl = $('chat'), inputEl = $('input'), sendBtn = $('send'), dotEl = $('dot');
let sending = false;
let history = [];

const cfg = {
  key: localStorage.getItem('ds_key') || '',
  model: localStorage.getItem('ds_model') || 'deepseek-chat',
  system: localStorage.getItem('ds_system') || '你是一个简洁、友好的中文助手，回答尽量简短。'
};

try { history = JSON.parse(localStorage.getItem('ds_history') || '[]'); }
catch(e) { history = []; }

const saveHistory = () => localStorage.setItem('ds_history', JSON.stringify(history));
const scrollBottom = () => { chatEl.scrollTop = chatEl.scrollHeight; };
const updateDot = () => dotEl.classList.toggle('on', !!cfg.key);

function appendMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  chatEl.appendChild(div);
  return div;
}

function renderAll() {
  chatEl.innerHTML = '';
  if (history.length === 0) {
    appendMsg('assistant', cfg.key
      ? '你好，有什么可以帮你的？'
      : '请先点右上角「设置」，填入 DeepSeek API Key。');
  } else {
    history.forEach(m => appendMsg(m.role, m.content));
  }
  scrollBottom();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;
  if (!cfg.key) { openSettings(); return; }

  if (history.length === 0) chatEl.innerHTML = '';

  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  history.push({ role: 'user', content: text });
  appendMsg('user', text);
  saveHistory();
  scrollBottom();

  const botEl = appendMsg('assistant', '');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  botEl.appendChild(cursor);

  try {
    const messages = [{ role: 'system', content: cfg.system }, ...history];
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + cfg.key
      },
      body: JSON.stringify({ model: cfg.model, messages, stream: true })
    });

    if (!res.ok) {
      const t = await res.text();
      throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 180));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith('data:')) continue;
        const data = s.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          const d = (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || '';
          if (d) {
            full += d;
            botEl.textContent = full;
            botEl.appendChild(cursor);
            scrollBottom();
          }
        } catch(e) {}
      }
    }

    cursor.remove();
    if (!full) {
      botEl.className = 'msg error';
      botEl.textContent = '（没有收到回复）';
    } else {
      history.push({ role: 'assistant', content: full });
      saveHistory();
    }
  } catch(err) {
    cursor.remove();
    botEl.className = 'msg error';
    botEl.textContent = '出错了：' + err.message;
  } finally {
    sending = false;
    sendBtn.disabled = false;
    scrollBottom();
  }
}

function openSettings() {
  $('cfg-key').value = cfg.key;
  $('cfg-model').value = cfg.model;
  $('cfg-system').value = cfg.system;
  $('settings').classList.add('show');
}
function closeSettings() { $('settings').classList.remove('show'); }

sendBtn.addEventListener('click', send);
$('btn-settings').addEventListener('click', openSettings);
$('btn-cancel').addEventListener('click', closeSettings);

$('btn-save').addEventListener('click', () => {
  cfg.key = $('cfg-key').value.trim();
  cfg.model = $('cfg-model').value;
  cfg.system = $('cfg-system').value.trim() || '你是一个简洁、友好的中文助手。';
  localStorage.setItem('ds_key', cfg.key);
  localStorage.setItem('ds_model', cfg.model);
  localStorage.setItem('ds_system', cfg.system);
  updateDot();
  closeSettings();
  if (history.length === 0) renderAll();
});

$('btn-clear').addEventListener('click', () => {
  if (!confirm('确定清空所有聊天记录？')) return;
  history = [];
  saveHistory();
  renderAll();
  closeSettings();
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});

updateDot();
renderAll();
</script>
</body>
</html>
